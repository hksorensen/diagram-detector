# Pre-commit hooks for diagram-detector
# Run automatically before each git commit to catch simple errors
#
# Install: pre-commit install
# Run manually: pre-commit run --all-files
# Update hooks: pre-commit autoupdate

repos:
  # Ruff: Fast Python linter (replaces flake8, isort, etc.)
  # Catches: unused imports, undefined names, syntax errors, style issues
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      # Run linter
      - id: ruff
        args: [--fix]  # Automatically fix issues when possible

      # Run formatter (optional, like black)
      - id: ruff-format

  # Mypy: Static type checker (DISABLED - too many pre-existing type issues)
  # Re-enable after type cleanup: uncomment the block below
  # Ruff already catches the critical errors (undefined names, wrong attributes, unused imports)
  #
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.13.0
  #   hooks:
  #     - id: mypy
  #       args: [
  #         --ignore-missing-imports,
  #         --no-strict-optional,
  #         --no-warn-return-any,
  #         --no-warn-unused-ignores,
  #         --allow-untyped-calls,
  #         --allow-untyped-defs,
  #         --allow-incomplete-defs,
  #       ]
  #       additional_dependencies: [types-PyYAML, types-requests]
  #       files: ^diagram_detector/.*\.py$
  #       exclude: ^tests/

  # Basic checks (built-in)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Check for merge conflict markers
      - id: check-merge-conflict
      # Check YAML syntax
      - id: check-yaml
      # Trim trailing whitespace
      - id: trailing-whitespace
      # Ensure files end with newline
      - id: end-of-file-fixer
      # Check for large files (>500KB)
      - id: check-added-large-files
        args: [--maxkb=500]
