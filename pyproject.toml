[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diagram-detector"
version = "1.3.2"
description = "Production-ready diagram detection for academic papers using YOLO11"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Henrik Kragh Sørensen", email = "hks@ku.dk"}
]
maintainers = [
    {name = "Henrik Kragh Sørensen", email = "hks@ku.dk"}
]
keywords = [
    "diagram",
    "detection",
    "yolo",
    "computer-vision",
    "academic-papers",
    "pdf",
    "machine-learning"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "ultralytics>=8.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "opencv-python-headless==4.8.1.78",
    "pillow>=10.0.0",
    "numpy>=1.24.0,<2.0.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "pymupdf>=1.23.0",  # PyMuPDF (fitz) - much faster than pdf2image
    "huggingface_hub>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "flake8>=6.0.0",
    "mypy>=1.4.0",
    "isort>=5.12.0",
]
onnx = [
    "onnxruntime>=1.15.0",
]
gpu = [
    "onnxruntime-gpu>=1.15.0",
]
tensorrt = [
    # Pin to cu12-compatible range; 10.7+ pulls tensorrt_cu13 which needs CUDA 12.6+ driver
    "tensorrt>=10.6.0,<10.7.0",
    "onnx>=1.12.0",  # Required for TensorRT export (PyTorch → ONNX → TensorRT)
]

[project.urls]
Homepage = "https://github.com/hksorensen/diagram-detector"
Documentation = "https://diagram-detector.readthedocs.io"
Repository = "https://github.com/hksorensen/diagram-detector"
Issues = "https://github.com/hksorensen/diagram-detector/issues"
Changelog = "https://github.com/hksorensen/diagram-detector/blob/main/CHANGELOG.md"

[project.scripts]
diagram-detect = "diagram_detector.cli:main"

[tool.setuptools]
packages = ["diagram_detector"]

[tool.setuptools.package-data]
diagram_detector = ["py.typed", "models/"]

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
# Exclude generated or vendored files
exclude = [".git", ".venv", "__pycache__", "build", "dist"]
line-length = 120

[tool.ruff.lint]
# E: pycodestyle errors (syntax)
# F: pyflakes (undefined names, unused imports)
# I: isort (import organization)
select = ["E", "F", "I"]

# Ignore overly strict rules
ignore = [
    "E501",  # Line too long (handled by formatter)
    "E731",  # Lambda assignment
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Too strict for research code
ignore_missing_imports = true  # Don't complain about external packages

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=diagram_detector --cov-report=html --cov-report=term"

[tool.coverage.run]
source = ["diagram_detector"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
